version: "3.6"

services:
  db:
    container_name: database
    image: postgres:16.1
    restart: always
    environment:  
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - '5000:5432'
    expose:
      - '5000'
    # networks:
    #   - transcendence
    volumes:
      - db-data:/var/lib/postgresql/data

  back:
    build:
      context: ./back
      dockerfile: ./Dockerfile
    container_name: api_back
    environment:  
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FORTYTWO_APP_ID: ${FORTYTWO_APP_ID}
      FORTYTWO_APP_SECRET: ${FORTYTWO_APP_SECRET}
      AUTH_APP_NAME: ${AUTH_APP_NAME}
      URL_FRONT: ${URL_FRONT}
      URL_BACK: ${URL_BACK}
      DOMAIN: ${DOMAIN}
    # ports:
    #   - '3333:3333'
    #   - '5555:5555'
    depends_on:
      - db
    volumes:
    #   - ./back/src:/app/src
      # - ./back/defaultChannelAvatar:/app/defaultChannelAvatar
      # - ./back/defaultUserAvatars:/app/defaultUserAvatars
      - ./back/uploads:/app/uploads
    #   - ./back/prisma:/app/prisma
    #   - ./back/package.json:/app/package.json
    #   - ./back/package-lock.json:/app/package-lock.json
    # networks:
    #   - transcendence

  front:
    build:
      context: ./front
      dockerfile: ./Dockerfile
    container_name: api_front
    environment:  
      VITE_IP_BACK: ${VITE_IP_BACK}
      VITE_PORT_BACK: ${VITE_PORT_BACK}
      VITE_URL_BACK: ${VITE_URL_BACK}
    # ports:
    #   - '4173:4173'
    #   - '5173:5173'
    depends_on:
      - back
    # volumes:
    #   - ./front/src:/app/src
    #   - ./front/index.html:/app/index.html
    #   - ./front/style.css:/app/style.css
    #   - ./front/package.json:/app/package.json
    #   - ./front/package-lock.json:/app/package-lock.json
    #   - ./front/tsconfig.json:/app/tsconfig.json
    # networks:
    #   - transcendence

volumes:
  db-data:
    name: db-data

